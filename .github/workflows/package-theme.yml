name: Package theme

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the archive, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full libxml2-utils

      - name: Validate theme XML
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            xmllint --noout "$f" || { echo "INVALID: $f"; exit 1; }
          done < <(find theme -name '*.xml' -print0)

      - name: Stage es-theme-SOLO-Ultra/
        run: |
          set -euo pipefail
          test -f theme/theme.xml
          rm -rf build
          mkdir -p build/es-theme-SOLO-Ultra
          cp -a theme/. build/es-theme-SOLO-Ultra/
          cp README.md LICENSE build/es-theme-SOLO-Ultra/

      - name: Create 7z archive
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          cd build
          NAME="es-theme-SOLO-Ultra-${VERSION}.7z"
          7z a -t7z -mx=5 "$NAME" es-theme-SOLO-Ultra
          7z l "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-theme-SOLO-Ultra
          path: build/*.7z*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" build/*.7z build/*.sha256 --clobber
          else
            gh release create "$VERSION" build/*.7z build/*.sha256 \
              --title "$VERSION" --generate-notes
          fi
